<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Security check – PDF2Wordly</title>
<meta name="description" content="Security check used by the PDF2Wordly Android app before e-mail sign-in.">
<meta name="robots" content="noindex, follow">
<!-- seo:end -->
<!--
  Security check for the PDF2Wordly Android app (not a page for visitors).
  The app opens it in a WebView before e-mail sign-up, log-in and "Resend code", because
  Supabase captcha protection (Cloudflare Turnstile) is ON. The widget uses the same public
  site key as auth.js (hostname pdf2wordly.com). The token goes to the app only through
  window.pdf2wordlyBridge, which the app injects for https://pdf2wordly.com alone
  (androidx.webkit addWebMessageListener). No secret here: Supabase checks the token.
  ?lang=en|fr|ar and ?theme=light|dark set the widget language and colors.
-->
<style>
  :root { color-scheme: light; --bg: #FFFFFF; --text: #1C1917; --muted: #57534E; }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #1C1B1F; --text: #F5F5F4; --muted: #D6D3D1; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 8px; }
  #msg { color: var(--muted); text-align: center; margin: 0; min-height: 1.5em; }
  #box { width: 100%; display: flex; justify-content: center; }
</style>
</head>
<body>
<main>
  <div id="box"></div>
  <p id="msg" role="status"></p>
</main>
<noscript><p>This page is used by the PDF2Wordly app.</p></noscript>
<script>
(function () {
  'use strict';
  // Same public key as TURNSTILE_SITE_KEY in auth.js (a test checks they match).
  var SITE_KEY = '0x4AAAAAAGIi-TmOWlcKHDZg';
  var TEXTS = {
    en: { app: 'This page is used by the PDF2Wordly app.', done: 'Done. Returning to the app…' },
    fr: { app: 'Cette page est utilisée par l’application PDF2Wordly.', done: 'C’est fait. Retour à l’application…' },
    ar: { app: 'تستخدم تطبيق PDF2Wordly هذه الصفحة.', done: 'تم. جارٍ الرجوع إلى التطبيق…' }
  };
  var params = new URLSearchParams(window.location.search);
  var lang = TEXTS[params.get('lang')] ? params.get('lang') : 'en';
  var theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  var msg = document.getElementById('msg');

  var bridge = window.pdf2wordlyBridge;
  function send(obj) {
    if (bridge && typeof bridge.postMessage === 'function') bridge.postMessage(JSON.stringify(obj));
  }
  if (!bridge) { msg.textContent = TEXTS[lang].app; return; } // opened outside the app

  window.onPwAppTurnstile = function () {
    window.turnstile.render('#box', {
      sitekey: SITE_KEY,
      theme: theme,
      language: lang,
      size: 'flexible',
      'refresh-expired': 'auto',
      callback: function (token) { msg.textContent = TEXTS[lang].done; send({ type: 'token', token: token }); },
      'expired-callback': function () { msg.textContent = ''; send({ type: 'expired' }); },
      'error-callback': function (code) { send({ type: 'error', code: String(code || '') }); return true; }
    });
  };
  var s = document.createElement('script');
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onPwAppTurnstile';
  s.async = true;
  s.defer = true;
  s.onerror = function () { send({ type: 'error', code: 'load' }); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
